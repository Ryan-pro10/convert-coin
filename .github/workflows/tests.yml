# Roda os testes (node --test) a cada push e pull request.
# Não instala dependências: o projeto não tem nenhuma.
name: Testes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          TZ: America/Sao_Paulo # mesmo fuso do app, para os testes de data
