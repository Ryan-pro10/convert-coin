<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinvert | Conversor de moedas em tempo real</title>
    <meta name="description"
        content="Converta Real, Dólar, Euro, Libra, Bitcoin e Guarani com cotações em tempo real. Conversor de moedas rápido, gratuito e direto no navegador.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#11111b" media="(prefers-color-scheme: dark)">
    <link rel="canonical" href="https://ryan-pro10.github.io/convert-coin/">

    <!-- Favicon e PWA (instalável no celular, funciona offline) -->
    <link rel="icon" href="./icons/favicon-48.png" type="image/png" sizes="48x48">
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Coinvert">

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Coinvert">
    <meta property="og:title" content="Coinvert | Conversor de moedas em tempo real">
    <meta property="og:description"
        content="Converta Real, Dólar, Euro, Libra, Bitcoin e Guarani com cotações atualizadas.">
    <meta property="og:url" content="https://ryan-pro10.github.io/convert-coin/">
    <meta property="og:image" content="https://ryan-pro10.github.io/convert-coin/pagina.png">
    <meta property="og:image:alt" content="Tela do conversor de moedas Coinvert">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">

    <!-- Scripts clássicos com defer: funcionam no GitHub Pages e também abrindo o arquivo direto. -->
    <script src="./js/currencies.js" defer></script>
    <script src="./js/format.js" defer></script>
    <script src="./js/api.js" defer></script>
    <script src="./js/prefs.js" defer></script>
    <script src="./js/chart.js" defer></script>
    <script src="./js/pwa.js" defer></script>
    <script src="./js/ui.js" defer></script>
</head>

<body>
    <header>
        <h1 class="visually-hidden">Coinvert: conversor de moedas</h1>
        <img src="./img/logo.png" class="logo" alt="Logotipo do Coinvert" width="300" height="300">
    </header>

    <main>
        <!-- Coluna do conversor (em telas largas, o histórico fica ao lado) -->
        <div class="converter-col">
        <form class="converter" id="converter" novalidate>
            <label for="from-currency">Converter <b>de</b></label>
            <select id="from-currency" class="select">
                <option value="BRL" selected>R$ Real brasileiro</option>
                <option value="USD">US$ Dólar americano</option>
                <option value="EUR">€ Euro</option>
                <option value="GBP">£ Libra esterlina</option>
                <option value="BTC">₿ Bitcoin</option>
                <option value="PYG">₲ Guarani paraguaio</option>
            </select>

            <label for="to-currency">Converter <b>para</b></label>
            <select id="to-currency" class="select">
                <option value="BRL">R$ Real brasileiro</option>
                <option value="USD" selected>US$ Dólar americano</option>
                <option value="EUR">€ Euro</option>
                <option value="GBP">£ Libra esterlina</option>
                <option value="BTC">₿ Bitcoin</option>
                <option value="PYG">₲ Guarani paraguaio</option>
            </select>

            <label for="amount">Valor</label>
            <input id="amount" class="input" type="text" inputmode="decimal" autocomplete="off"
                placeholder="Ex.: 100,00" value="100" maxlength="20" aria-describedby="amount-hint">
            <p class="hint" id="amount-hint">Use vírgula ou ponto para os centavos.</p>

            <button type="button" class="refresh-button" id="refresh-button">
                <span class="spinner" aria-hidden="true"></span>
                <span class="refresh-label">Atualizar cotação</span>
            </button>
        </form>

        <!-- Mensagens de carregamento, aviso de cache ou erro -->
        <p class="notice" id="notice" role="status" hidden></p>

        <section class="result is-loading" id="result" aria-label="Resultado da conversão" aria-busy="true">
            <div class="coin-box">
                <img class="coin-img" id="from-img" src="./img/brasil.png" alt="Bandeira do Brasil" width="52" height="52">
                <p class="coin" id="from-name">Real brasileiro</p>
                <p class="valor" id="from-value">R$ 100,00</p>
            </div>

            <button type="button" class="swap-button" id="swap-button"
                aria-label="Inverter moedas de origem e destino" title="Inverter moedas">
                <img src="./img/Vector.png" alt="" width="35" height="50">
                <span class="swap-icon" aria-hidden="true">⇄</span>
            </button>

            <div class="coin-box" aria-live="polite" aria-atomic="true">
                <img class="coin-img" id="to-img" src="./img/estados-unidos.png" alt="Bandeira dos Estados Unidos" width="52" height="52">
                <p class="coin" id="to-name">Dólar americano</p>
                <p class="valor valor--result" id="to-value">—</p>
            </div>

            <div class="result-actions">
                <button type="button" class="chip-button" id="copy-button" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
                    <span class="chip-label">Copiar</span>
                </button>
                <button type="button" class="chip-button" id="share-button" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                    <span class="chip-label">Compartilhar</span>
                </button>
            </div>
            <p class="visually-hidden" id="action-status" role="status"></p>

            <p class="rate-line" id="rate-line" hidden>
                <span id="rate-text"></span>
                <span class="rate-change" id="rate-change" hidden></span>
            </p>
            <p class="updated-at" id="updated-at"></p>
        </section>
        </div>

        <!-- Coluna lateral: histórico do par selecionado -->
        <div class="side-col">
        <section class="history is-loading" id="history" aria-labelledby="history-title" aria-busy="true">
            <div class="history-head">
                <h2 class="history-title" id="history-title">Histórico</h2>
                <div class="period-group" role="group" aria-label="Período do histórico">
                    <button type="button" class="period-button" data-days="7" aria-pressed="false">7D</button>
                    <button type="button" class="period-button" data-days="30" aria-pressed="true">30D</button>
                    <button type="button" class="period-button" data-days="90" aria-pressed="false">90D</button>
                </div>
            </div>

            <p class="history-summary" id="history-summary">
                <span id="history-pair"></span>
                <span class="rate-change" id="history-change" hidden></span>
            </p>

            <div class="history-body" id="history-body">
                <div class="chart" id="chart" tabindex="0"
                    aria-label="Gráfico do histórico da cotação. Use as setas para percorrer os dias."></div>
                <div class="chart-axis" aria-hidden="true">
                    <span id="chart-start"></span>
                    <span id="chart-end"></span>
                </div>
                <p class="chart-range" id="chart-range"></p>

                <details class="history-table">
                    <summary>Ver dados em tabela</summary>
                    <div class="table-wrap">
                        <table>
                            <caption class="visually-hidden" id="history-caption">Histórico da cotação</caption>
                            <thead>
                                <tr><th scope="col">Data</th><th scope="col">Cotação</th></tr>
                            </thead>
                            <tbody id="history-rows"></tbody>
                        </table>
                    </div>
                </details>
            </div>

            <p class="history-message" id="history-message" hidden></p>
            <p class="visually-hidden" id="chart-readout" aria-live="polite"></p>
        </section>

        <!-- Aparece só quando o navegador permite instalar o app -->
        <div class="install-row" id="install-row" hidden>
            <button type="button" class="chip-button" id="install-button">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
                <span class="chip-label">Instalar app</span>
            </button>
        </div>
        </div>

        <noscript>
            <p class="notice notice--error">Ative o JavaScript para usar o conversor.</p>
        </noscript>
    </main>
</body>

</html>
